services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: hpi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hpi"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    working_dir: /workspace/apps/api
    command: ["pnpm", "db:migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/hpi
      HPI_APP_PASSWORD: ${HPI_APP_PASSWORD:?Set HPI_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    working_dir: /workspace/apps/api
    command: ["pnpm", "start"]
    environment:
      DATABASE_URL: postgres://hpi_app:${HPI_APP_PASSWORD:?Set HPI_APP_PASSWORD}@postgres:5432/hpi
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      PORT: 4000
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    working_dir: /workspace/apps/api
    command: ["pnpm", "worker"]
    environment:
      DATABASE_URL: postgres://hpi_app:${HPI_APP_PASSWORD:?Set HPI_APP_PASSWORD}@postgres:5432/hpi
      HPI_WORKER_MAIN: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    working_dir: /workspace/apps/web
    command: ["pnpm", "start"]
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: 3000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  pgdata:
